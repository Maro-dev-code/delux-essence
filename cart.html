<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="cart.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
</head>
<body>
    <header>
          <a href="index.html" class="logo"
            ><img src="img/logo1.1.png" alt="logo"
          /></a>
          <ul class="nav" id="nav">
            <a href="index.html" class="active">Home</a>
            <a href="shop.html">Shop</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i></a>
            <a href="#" id="close"><i class="fa-solid fa-xmark"></i></a>
          </ul>

          <div id="mobile">
            <i id="bar" class="fa-solid fa-bars"></i>
          </div>
        </header>

        <h1>My Cart</h1>
        <div id="cartItems"></div>
        <div id="cartSummary"></div>





        <!-- QUICK VIEW MODAL -->
<div id="quickView" class="quick-view hidden">

  <div class="quick-view-overlay"></div>

  <div class="quick-view-content">
    <button id="closeQuickView" class="close-btn">✕</button>

    <img id="quickImage" src="" alt="Product image">

    <h2 id="quickName"></h2>
    <p id="quickPrice"></p>
    <p id="quickDesc"></p>

    <button id="quickAddToCart" class="add-to-cart">
      Add to Cart
    </button>
  </div>

</div>



<!-- QUICK ORDER FORM MODAL -->
<div id="orderModal" class="order-modal hidden">

  <div class="overlay"></div>

  <form id="orderForm" class="order-box">

    <button type="button" id="closeModal" class="close-btn">✕</button>

    <h3>Complete Your Order</h3>

    <!-- Product Preview -->
    <img id="productImage" src="" alt="Product Image">
    <p id="productName"></p>
    <p id="productPrice"></p>

    <!-- Product Options -->
    <select id="productSize" required>
      <option value="">Select Size</option>
      <option>S</option>
      <option>M</option>
      <option>L</option>
      <option>XL</option>
    </select>

    <input type="number" id="productQty" min="1" value="1" required>

    <!-- Customer Details -->
    <input type="text" id="customerName" placeholder="Full Name" required>
    <input type="tel" id="customerPhone" placeholder="Phone Number" required>
    <input type="email" id="customerEmail" placeholder="Email Address">
    <textarea id="customerAddress" placeholder="Delivery Address" required></textarea>

    <button type="submit" class="send-btn">
      Send Order via WhatsApp
    </button>

  </form>
</div>



         <footer>
          <div class="footer-nav">
            <img src="img/logo-1.png" alt="" />
            <ul>
              <li><a href="index.html">Home</a></li>
              <li><a href="shop.html">Shop</a></li>
              <li><a href="about.html">About</a></li>
              <li><a href="contact.html">Contact</a></li>
            </ul>
          </div>

          <div class="social-links">
            <p>Deluxe Essence &copy; 2025. All rights reserved.</p>

            <ul>

              </li>

              </li>

              </li>
              <li>
                <a href=""><i class="fab fa-linkedin"></i></a>
              </li>
            </ul>
          </div>
        </footer>
    <script src="cart.js"></script>
</body>
</html>
