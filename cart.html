<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - Deluxe Esence</title>
  <link rel="stylesheet" href="cart.css">
  <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
</head>
<body>
  <!-- NAVBAR (Optional if same as shop.html) -->
   <header>
          <a href="index.html" class="logo"
            ><img src="img/logo1.1.png" alt="logo"
          /></a>
          <ul class="nav" id="nav">
            <a href="index.html" class="active">Home</a>
            <a href="shop.html">Shop</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="#" id="close"><i class="fa-solid fa-xmark"></i></a>
              <a href="cart.html" class="cart-icon">
              🛒
              <span id="cartCount">0</span>
</a>

          </ul>

          <div id="mobile">
            <i id="bar" class="fa-solid fa-bars"></i>
          </div>
        </header>


      <h1>Deluxe Esence</h1>

  <main>
    <section class="cart-container">
      <h2>Your Cart</h2>
      <div id="cartItems"></div>

      <div class="cart-total">
        <p>Total: ₦<span id="totalAmount">0</span></p>
      </div>

      <h3>Checkout Information</h3>
      <form id="checkoutForm">
        <input type="text" id="customerName" placeholder="Full Name" required>
        <input type="email" id="customerEmail" placeholder="Email" required>
        <input type="tel" id="customerPhone" placeholder="Phone Number" required>
        <input type="text" id="customerAddress" placeholder="Delivery Address" required>
        <!-- <select id="customerSize" required>
          <option value="">Select Size</option>
          <option value="S">Small</option>
          <option value="M">Medium</option>
          <option value="L">Large</option>
          <option value="XL">XL</option> -->
        </select>
        <button type="submit">Checkout via WhatsApp</button>
      </form>
    </section>

    <footer>
          <div class="footer-nav">
            <img src="img/logo-1.png" alt="" />
            <ul>
              <li><a href="index.html">Home</a></li>
              <li><a href="shop.html">Shop</a></li>
              <li><a href="about.html">About</a></li>
              <li><a href="contact.html">Contact</a></li>
            </ul>
          </div>

          <div class="social-links">
            <p>Deluxe Esence &copy; 2025. All rights reserved.</p>

            <ul>
              <li>
                <a href=""><i class="fab fa-youtube"></i></a>
              </li>
              <li>
                <a href=""><i class="fab fa-facebook"></i></a>
              </li>
              <li>
                <a href=""><i class="fab fa-twitter"></i></a>
              </li>
              <li>
                <a href=""><i class="fab fa-instagram"></i></a>
              </li>
              <li>
                <a href=""><i class="fab fa-linkedin"></i></a>
              </li>
            </ul>
          </div>
        </footer>

  </main>

  <script src="cart.js"></script>
</body>
</html>
