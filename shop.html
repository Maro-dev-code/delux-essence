<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop | Deluxe Essence</title>

  <link rel="stylesheet" href="shop.css">
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header class="shop-header">
    <div class="logo">Deluxe Essence</div>

    <a href="cart.html" class="cart-link">
      Cart
      <span class="cart-count" id="cartCount">0</span>
    </a>
  </header>

  <!-- ================= SHOP HERO ================= -->
  <section class="shop-hero">
    <h1>Shop Deluxe Esence</h1>
    <p>Curated pieces designed for comfort, confidence, and everyday elegance.</p>
  </section>

  <!-- ================= FILTER BAR ================= -->
  <nav class="filter-bar">
    <button class="filter active" data-filter="all">All</button>
    <button class="filter" data-filter="dresses">Dresses</button>
    <button class="filter" data-filter="casual">Casual</button>
    <button class="filter" data-filter="luxe">Luxe</button>
    <button class="filter" data-filter="new">New</button>
  </nav>


  <!-- ================= PRODUCT GRID ================= -->
  <main class="shop-container">
    <section class="product-grid" id="productGrid">
      <!-- Products injected via JavaScript -->
    </section>
  </main>


  <script src="shop.js"></script>
</body>
</html>
